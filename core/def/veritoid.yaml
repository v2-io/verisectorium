term-group: [veritoid, content, veritoid⸱kind]
status: provisional

intro: |
  The «store» holds pieces of «CONTENT»: a formal statement, a step of a derivation, a paragraph of explanation, a caption, a question, an auditor's note. Every piece of content is of a declared «VERITOID⸱KIND», which says what form the content takes, what it «answers⸱to», and which questions may be asked of it. A «VERITOID» is one piece of content of a declared kind, together with the answers to those questions. A veritoid almost never makes sense alone; it sits in a «segment» with others it depends on, and the segment is where it is written and reviewed.

terms:
  veritoid:
    def: One piece of content of a declared kind, together with the answers to the questions that kind allows.
    pos: noun
    pl: -s
    avoid:
      atom: used for this before, and it sounds related to the atomic changeset, which it is not
      record: used for this and for the whole segment at once
      statement: too narrow; a question or a note is a veritoid too
      unit of fate: how a piece fails is one question among several asked of it, not what makes it one piece
    rels:
      - {rel: of-kind, to: veritoid⸱kind, card: "{1,1}"}
      - {rel: holds, to: content, card: "{1,1}"}
      - {rel: states, to: ground, card: "{1,N}"}
      - {rel: carries, to: bound, card: "{0,N}"}
      - {rel: claims, to: claimed⸱level, card: "{0,1}"}
      - {rel: sits-in, to: slot, card: "{1,1}", note: one slot of one segment}
    invariants:
      - It is never changed alone. It changes only inside a «segment⸱changeset».
      - It contains no veritoid. Where its parts stand or fall separately, it is split.
      - It has no «name» of its own; it is reached through its segment.
      - Its content, ground, bounds, claimed level and references are «written». Its answers are «computed».

  content:
    def: The text or data a veritoid holds, at a version.
    pos: noun
    synonyms: [body]
    invariants:
      - Two contents are the same version when they are the same after normalization. A reflow mints no version.

  veritoid⸱kind:
    def: A declared type of veritoid, saying what form its content takes, what it answers to, and which questions may be asked of it.
    pos: noun
    pl: veritoid⸱kinds
    avoid:
      filename prefix: a kind is declared, never carried in a name
      speech act: an earlier model individuated kinds by how they fail; here by what is asked of them
    rels:
      - {rel: allows, to: dimension, card: "{1,N}", note: which are open for a given veritoid depends on its ground}
      - {rel: declares, to: move, card: "{0,N}"}
    invariants:
      - A veritoid moving up any ladder never changes its kind.
      - A kind earns its place when some question is asked of its veritoids that is asked of no other kind's, or when some «move» treats them differently.

discussion:
  - 'Why the piece is defined by what is attached to it and not by how it fails. For months the unresolved dissonance was that the questions asked of content attach to parts of a segment, not to the file, while markdown with frontmatter gives exactly one place to attach anything. The veritoid is the smallest thing questions attach to. "One fate" is then a quality target rather than the definition: a well-cut veritoid is one whose answers move together, and a check that narrows part of a veritoid and not the rest is the evidence that it wants splitting. Grain is discovered by adjudication and recorded as a split, not declared up front.'
  - Why two levels of content and only two. The decomposition could go on as mathematics ("turtles all the way down"); two levels, veritoids and the segments they are assembled into, is where practice stops, and every rule in the model is stated at one of those two levels.

examples:
  - In ASF's files today a veritoid is usually one second-level section of a segment file, or something smaller inside one, such as one lettered item under a statement, or one of the three entries in a claim record.
  - The formal claim of a derived result; one step of its derivation; its plain-language description; its explanation for an eight-year-old. Four veritoids, of three kinds, in one segment.

working-notes:
  - Open, and it matters. Whether a veritoid has an identity of its own that survives being moved, or is only its place in a segment. See «recut». Every split, promote and inbox drain hits this.
  - Not confirmed. That there are exactly two levels. Joseph said he was still not sure; the discussion's lean is a reading of his "practical granularity".
  - Open. Whether the word survives. Joseph offered it half in jest, for having no history; "content+dimensions" was his other candidate.
  - Adjudicated against msc/notes 05 (21:52Z), 08/06, 08/07, 08/08, 09 §2.1, 11 def-veritoid.
