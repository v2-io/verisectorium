<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1060 745" width="1060" height="745" font-family="Inter, -apple-system, 'Helvetica Neue', Helvetica, Arial, sans-serif">
<title>Strategic cycle — areas of uncertainty</title>
<style>
  :root {
    --bg:#ffffff; --ink:#0f172a; --muted:#64748b; --faint:#94a3b8;
    --box:#f8fafc; --boxline:#cbd5e1; --badge:#0f172a; --badgeink:#ffffff;
    --lane:#f1f5f9; --c56:#334155; --c7:#4f46e5; --eq:#94a3b8;
    --observe:#2563eb; --orient:#7c3aed; --decide:#d97706; --act:#16a34a; --pillink:#ffffff;
  }
  @media (prefers-color-scheme: dark) {
    :root {
      --bg:#0b1120; --ink:#e2e8f0; --muted:#94a3b8; --faint:#64748b;
      --box:#111827; --boxline:#334155; --badge:#e2e8f0; --badgeink:#0b1120;
      --lane:#151e30; --c56:#cbd5e1; --c7:#818cf8; --eq:#64748b;
      --observe:#60a5fa; --orient:#a78bfa; --decide:#fbbf24; --act:#4ade80; --pillink:#0b1120;
    }
  }
  .bg { fill:var(--bg); }
  .title { fill:var(--ink); font-size:22px; font-weight:650; letter-spacing:-0.01em; }
  .hdr { fill:var(--muted); font-size:12px; font-weight:600; letter-spacing:0.12em; text-transform:uppercase; }
  .box { fill:var(--box); stroke:var(--boxline); stroke-width:1.25; }
  .badge { fill:var(--badge); }
  .num { fill:var(--badgeink); font-size:14px; font-weight:700; }
  .lbl { fill:var(--ink); font-size:15.5px; }
  .lane { fill:var(--lane); }
  .lanehdr { font-size:13px; font-weight:650; }
  .pill { fill:var(--pillink); font-size:12px; font-weight:600; }
  .arc { fill:none; stroke-width:2; stroke-linecap:round; }
  .key { fill:var(--muted); font-size:12.5px; }
  .guide { stroke:var(--boxline); stroke-width:1; stroke-dasharray:2 4; }
</style>
<defs>
<marker id="ah-c56" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" style="fill:var(--c56)"/></marker>
<marker id="ah-c7" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" style="fill:var(--c7)"/></marker>
<marker id="ah-eq" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" style="fill:var(--eq)"/></marker>
<linearGradient id="g-Observe-Orient" x1="0" x2="1"><stop offset="0.3" style="stop-color:var(--observe)"/><stop offset="0.7" style="stop-color:var(--orient)"/></linearGradient>
<linearGradient id="g-Orient-Decide" x1="0" x2="1"><stop offset="0.3" style="stop-color:var(--orient)"/><stop offset="0.7" style="stop-color:var(--decide)"/></linearGradient>
</defs>
