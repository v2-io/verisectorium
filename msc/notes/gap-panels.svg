<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 712" width="1200" height="712" role="img"><title>Knowledge in one place, decision in another</title><desc>Three panels. In each, a director sits above a gap and the situation, where the knowledge is, sits below. Control sends detail down and pulls the situation up, and decides at the top. Adapt sends purpose and limits down, marks a boundary, and the decision is made inside the situation. Abdicate sends nothing, and the situation splits apart.</desc>
<style>
  :root {
    --bg:#ffffff; --ink:#0f172a; --muted:#475569; --faint:#94a3b8; --line:#cbd5e1; --panel:#f8fafc; --rowalt:#f8fafc;
    --ctl:#3d5a80; --ctl-soft:#eaf0f7; --adp:#b26a12; --adp-soft:#fbf1e3; --abd:#7d838c; --abd-soft:#f1f2f4;
  }
  @media (prefers-color-scheme: dark) {
    :root {
      --bg:#0b1120; --ink:#e2e8f0; --muted:#a3b0c2; --faint:#64748b; --line:#334155; --panel:#111827; --rowalt:#0f1626;
      --ctl:#93b2dc; --ctl-soft:#152033; --adp:#f0b35e; --adp-soft:#241c12; --abd:#9aa3ae; --abd-soft:#171c24;
    }
  }
  .bg { fill:var(--bg); }
  text { font-family: Inter, -apple-system, 'Helvetica Neue', Helvetica, Arial, sans-serif; }
  .title { fill:var(--ink); font-size:24px; font-weight:650; letter-spacing:-0.01em; }
  .subtitle { fill:var(--muted); font-size:15.5px; }
  .ink { fill:var(--ink); } .muted { fill:var(--muted); } .faint { fill:var(--faint); }
  .h-ctl { fill:var(--ctl); } .h-adp { fill:var(--adp); } .h-abd { fill:var(--abd); } .h-src { fill:var(--muted); }
  .hdr { font-size:15px; font-weight:700; letter-spacing:0.08em; }
  .pname { font-size:20px; font-weight:700; }
  .box { fill:var(--panel); stroke:var(--line); stroke-width:1.25; }
  .lbl { fill:var(--ink); font-size:15px; font-weight:600; }
  .small { fill:var(--muted); font-size:13px; }
  .tiny { fill:var(--muted); font-size:12px; }
  .cap { fill:var(--ink); font-size:14.5px; }
  .full { fill:var(--muted); font-size:13.5px; }
  .b { fill:var(--ink); font-weight:650; }
  .src { fill:var(--ink); font-size:13.5px; }
  .rname { fill:var(--ink); font-size:15px; font-weight:600; }
  .num { fill:var(--bg); font-size:13px; font-weight:700; }
  .badge { fill:var(--ink); }
  .quote { fill:var(--muted); font-size:13.5px; font-style:italic; }
</style><rect class="bg" width="1200" height="712" rx="14"/><defs><marker id="p-ctl" viewBox="0 0 10 10" refX="5" refY="5" markerWidth="2.6" markerHeight="2.6" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" style="fill:var(--ctl)"/></marker><marker id="p-adp" viewBox="0 0 10 10" refX="7" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" style="fill:var(--adp)"/></marker><marker id="p-adp2" viewBox="0 0 10 10" refX="7" refY="5" markerWidth="5" markerHeight="5" orient="auto"><path d="M0,0 L10,5 L0,10 z" style="fill:var(--adp)"/></marker><marker id="p-abd" viewBox="0 0 10 10" refX="7" refY="5" markerWidth="5" markerHeight="5" orient="auto"><path d="M0,0 L10,5 L0,10 z" style="fill:var(--abd)"/></marker></defs><text class="title" x="30" y="50">Knowledge in one place, decision in another</text><text class="subtitle" x="30" y="78">What each approach sends across the gap between the director and the situation</text><rect x="30" y="112" width="360" height="470" rx="14" style="fill:var(--ctl-soft)"/><text class="pname h-ctl" x="52" y="150">Control</text><g><rect class="box" x="125.0" y="174" width="170" height="46" rx="10"/><text class="lbl" x="210.0" y="203" text-anchor="middle">director</text></g><line x1="48" y1="308" x2="372" y2="308" style="stroke:var(--faint);stroke-width:1.25;stroke-dasharray:3 5"/><text class="tiny" x="50" y="300">the gap</text><rect class="box" x="65.0" y="394" width="290" height="78" rx="12"/><text class="lbl" x="83.0" y="426">the situation</text><text class="small" x="83.0" y="448">where the knowledge is</text><line x1="168.0" y1="226" x2="168.0" y2="364" style="stroke:var(--ctl);stroke-width:12" marker-end="url(#p-ctl)"/><line x1="252.0" y1="388" x2="252.0" y2="250" style="stroke:var(--ctl);stroke-width:12;opacity:.55" marker-end="url(#p-ctl)"/><text class="small" x="148.0" y="344" text-anchor="end">detail</text><text class="small" x="272.0" y="344">the situation</text><path d="M317.0 186.0 L328.0 197.0 L317.0 208.0 L306.0 197.0 Z" style="fill:var(--ctl)"/><text class="tiny" x="333.0" y="201.0">decision</text><text class="cap" x="52" y="524"><tspan x="52" dy="0">Sends detail down and pulls the</tspan><tspan x="52" dy="20">situation up. The decision is made at</tspan><tspan x="52" dy="20">the top.</tspan></text><rect x="410" y="112" width="360" height="470" rx="14" style="fill:var(--adp-soft)"/><text class="pname h-adp" x="432" y="150">Adapt</text><g><rect class="box" x="505.0" y="174" width="170" height="46" rx="10"/><text class="lbl" x="590.0" y="203" text-anchor="middle">director</text></g><line x1="428" y1="308" x2="752" y2="308" style="stroke:var(--faint);stroke-width:1.25;stroke-dasharray:3 5"/><text class="tiny" x="430" y="300">the gap</text><rect class="box" x="445.0" y="394" width="290" height="78" rx="12"/><text class="lbl" x="463.0" y="426">the situation</text><text class="small" x="463.0" y="448">where the knowledge is</text><line x1="590.0" y1="254" x2="590.0" y2="372" style="stroke:var(--adp);stroke-width:3" marker-end="url(#p-adp)"/><text class="small" x="604.0" y="344">purpose and limits</text><rect x="433.0" y="382" width="314" height="102" rx="18" style="fill:none;stroke:var(--adp);stroke-width:2;stroke-dasharray:8 6"/><path d="M685.0 422.0 L696.0 433.0 L685.0 444.0 L674.0 433.0 Z" style="fill:var(--adp)"/><path d="M661.0 427.0 A 25 25 0 1 1 667.0 449.0" style="fill:none;stroke:var(--adp);stroke-width:2.25" marker-end="url(#p-adp2)"/><text class="tiny" x="685.0" y="504" text-anchor="middle">decision</text><text class="tiny" x="435.0" y="504">limits</text><text class="tiny" x="590.0" y="242" text-anchor="middle"><tspan x="590.0" dy="0">keeps accountability, intent and limits</tspan></text><text class="cap" x="432" y="524"><tspan x="432" dy="0">Sends purpose and limits down. The</tspan><tspan x="432" dy="20">decision stays with whoever is in the</tspan><tspan x="432" dy="20">situation.</tspan></text><rect x="790" y="112" width="360" height="470" rx="14" style="fill:var(--abd-soft)"/><text class="pname h-abd" x="812" y="150">Abdicate</text><g opacity="0.45"><rect class="box" x="885.0" y="174" width="170" height="46" rx="10"/><text class="lbl" x="970.0" y="203" text-anchor="middle">director</text></g><line x1="808" y1="308" x2="1132" y2="308" style="stroke:var(--faint);stroke-width:1.25;stroke-dasharray:3 5"/><text class="tiny" x="810" y="300">the gap</text><text class="small" x="970.0" y="344" text-anchor="middle" style="font-style:italic">nothing sent</text><rect class="box" x="830.0" y="398" width="80" height="44" rx="10" transform="rotate(-8 870.0 420)"/><line x1="820.0" y1="420" x2="804.0" y2="424" style="stroke:var(--abd);stroke-width:2" marker-end="url(#p-abd)"/><rect class="box" x="930.0" y="388" width="80" height="44" rx="10" transform="rotate(3 970.0 410)"/><rect class="box" x="1030.0" y="400" width="80" height="44" rx="10" transform="rotate(7 1070.0 422)"/><line x1="1120.0" y1="422" x2="1136.0" y2="426" style="stroke:var(--abd);stroke-width:2" marker-end="url(#p-abd)"/><text class="small" x="970.0" y="468" text-anchor="middle">the situation, each part on its own</text><text class="cap" x="812" y="524"><tspan x="812" dy="0">Sends nothing: no intent stated, no</tspan><tspan x="812" dy="20">limits marked, nothing looked at.</tspan></text><text class="quote" x="30" y="622"><tspan x="30" dy="0">Across all eight, the two approaches are van Creveld’s two options: “One is to increase its information-processing capacity, the other to design the organisation, and</tspan><tspan x="30" dy="19">indeed the task itself, in such a way as to enable it to operate on the basis of less information.”</tspan></text><text class="small" x="30" y="674"><tspan x="30" dy="0">Adapt is not a midpoint between control and abdicate: the director keeps the accountability, the intent and the limits, and gives away the how.</tspan></text></svg>