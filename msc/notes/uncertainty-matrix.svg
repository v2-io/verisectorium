<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1615 980" width="1615" height="980" role="img"><title>Eight uncertainties, three approaches</title><desc>A matrix. Rows are the eight areas of uncertainty in cascade order, each marked outside, inside or at the boundary. Columns are some sources of each uncertainty and the control, adapt and abdicate approaches to it, with the phrase each cell turns on in bold. Rows 2 to 4 are bracketed as coupled.</desc>
<style>
  :root {
    --bg:#ffffff; --ink:#0f172a; --muted:#475569; --faint:#94a3b8; --line:#cbd5e1; --panel:#f8fafc; --rowalt:#f8fafc;
    --ctl:#3d5a80; --ctl-soft:#eaf0f7; --adp:#b26a12; --adp-soft:#fbf1e3; --abd:#7d838c; --abd-soft:#f1f2f4;
  }
  @media (prefers-color-scheme: dark) {
    :root {
      --bg:#0b1120; --ink:#e2e8f0; --muted:#a3b0c2; --faint:#64748b; --line:#334155; --panel:#111827; --rowalt:#0f1626;
      --ctl:#93b2dc; --ctl-soft:#152033; --adp:#f0b35e; --adp-soft:#241c12; --abd:#9aa3ae; --abd-soft:#171c24;
    }
  }
  .bg { fill:var(--bg); }
  text { font-family: Inter, -apple-system, 'Helvetica Neue', Helvetica, Arial, sans-serif; }
  .title { fill:var(--ink); font-size:24px; font-weight:650; letter-spacing:-0.01em; }
  .subtitle { fill:var(--muted); font-size:15.5px; }
  .ink { fill:var(--ink); } .muted { fill:var(--muted); } .faint { fill:var(--faint); }
  .h-ctl { fill:var(--ctl); } .h-adp { fill:var(--adp); } .h-abd { fill:var(--abd); } .h-src { fill:var(--muted); }
  .hdr { font-size:15px; font-weight:700; letter-spacing:0.08em; }
  .pname { font-size:20px; font-weight:700; }
  .box { fill:var(--panel); stroke:var(--line); stroke-width:1.25; }
  .lbl { fill:var(--ink); font-size:15px; font-weight:600; }
  .small { fill:var(--muted); font-size:13px; }
  .tiny { fill:var(--muted); font-size:12px; }
  .cap { fill:var(--ink); font-size:14.5px; }
  .full { fill:var(--muted); font-size:13.5px; }
  .b { fill:var(--ink); font-weight:650; }
  .src { fill:var(--ink); font-size:13.5px; }
  .rname { fill:var(--ink); font-size:15px; font-weight:600; }
  .num { fill:var(--bg); font-size:13px; font-weight:700; }
  .badge { fill:var(--ink); }
  .quote { fill:var(--muted); font-size:13.5px; font-style:italic; }
</style><rect class="bg" width="1615" height="980" rx="14"/><text class="title" x="30" y="50">Eight uncertainties, three approaches</text><text class="subtitle" x="30" y="78">In every row the knowledge is in one place and the decision is in another. Control sends detail down and pulls the situation up.</text><text class="subtitle" x="30" y="100">Adapt sends purpose and limits down and leaves the decision with whoever is in the situation. Abdicate sends nothing.</text><text class="hdr h-src" x="294" y="150">SOME SOURCES</text><rect x="558" y="130" width="274" height="804" rx="10" style="fill:var(--ctl-soft)"/><text class="hdr h-ctl" x="569" y="150">CONTROL</text><rect x="838" y="130" width="294" height="804" rx="10" style="fill:var(--adp-soft)"/><text class="hdr h-adp" x="849" y="150">ADAPT</text><rect x="1138" y="130" width="254" height="804" rx="10" style="fill:var(--abd-soft)"/><text class="hdr h-abd" x="1149" y="150">ABDICATE</text><text class="hdr h-src" x="36" y="150">UNCERTAINTY</text><line x1="30" y1="160" x2="1395" y2="160" style="stroke:var(--line);stroke-width:1"/><circle class="badge" cx="50" cy="188" r="13"/><text class="num" x="50" y="192.5" text-anchor="middle">1</text><text class="rname" x="74" y="193"><tspan x="74" dy="0">current external state</tspan></text><text class="tiny" x="74" y="215">outside</text><text class="src" x="294" y="192"><tspan x="294" dy="0">Each sees a part. The future is not</tspan><tspan x="294" dy="19">there to be seen.</tspan></text><text class="full" x="569" y="192"><tspan x="569" dy="0"><tspan class="b">Gather until certain; </tspan>plan far and</tspan><tspan x="569" dy="19">fine.</tspan></text><text class="full" x="849" y="192"><tspan x="849" dy="0">Assess what you know, guess the rest,</tspan><tspan x="849" dy="19"><tspan class="b">decide "about right, now".</tspan></tspan></text><text class="full" x="1149" y="192"><tspan x="1149" dy="0"><tspan class="b">Don't look. </tspan>Wait for events and</tspan><tspan x="1149" dy="19">call it flexibility.</tspan></text><line x1="30" y1="234" x2="1395" y2="234" style="stroke:var(--line);stroke-width:1"/><circle class="badge" cx="50" cy="262" r="13"/><text class="num" x="50" y="266.5" text-anchor="middle">2</text><text class="rname" x="74" y="267"><tspan x="74" dy="0">internal capability</tspan></text><text class="tiny" x="74" y="289">inside</text><text class="src" x="294" y="266"><tspan x="294" dy="0">Self-estimates run both high and low.</tspan><tspan x="294" dy="19">Full knowledge comes only from doing.</tspan></text><text class="full" x="569" y="266"><tspan x="569" dy="0"><tspan class="b">Assume it is low </tspan>and specify the how;</tspan><tspan x="569" dy="19">or <tspan class="b">assume the paper strength.</tspan></tspan></text><text class="full" x="849" y="266"><tspan x="849" dy="0"><tspan class="b">Ask those who will do it </tspan>what they can</tspan><tspan x="849" dy="19">do. Expect to be surprised upward as well</tspan><tspan x="849" dy="19">as downward.</tspan></text><text class="full" x="1149" y="266"><tspan x="1149" dy="0">Assume they can; <tspan class="b">hand it over</tspan></tspan><tspan x="1149" dy="19"><tspan class="b">untested.</tspan></tspan></text><line x1="30" y1="323" x2="1395" y2="323" style="stroke:var(--line);stroke-width:1"/><circle class="badge" cx="50" cy="351" r="13"/><text class="num" x="50" y="355.5" text-anchor="middle">3</text><text class="rname" x="74" y="356"><tspan x="74" dy="0">internal intent &amp; its</tspan><tspan x="74" dy="20">coherence</tspan></text><text class="tiny" x="74" y="398">inside</text><text class="src" x="294" y="355"><tspan x="294" dy="0">Meaning is lost at every handover.</tspan><tspan x="294" dy="19">Whether it arrived can only be</tspan><tspan x="294" dy="19">checked by having it said back.</tspan></text><text class="full" x="569" y="355"><tspan x="569" dy="0"><tspan class="b">More detail, </tspan>more communication,</tspan><tspan x="569" dy="19">more initiatives.</tspan></text><text class="full" x="849" y="355"><tspan x="849" dy="0"><tspan class="b">What and why, </tspan>and only what they cannot</tspan><tspan x="849" dy="19">work out themselves. <tspan class="b">Backbrief.</tspan></tspan></text><text class="full" x="1149" y="355"><tspan x="1149" dy="0"><tspan class="b">State no intent. </tspan>"Get on with it."</tspan></text><line x1="30" y1="417" x2="1395" y2="417" style="stroke:var(--line);stroke-width:1"/><circle class="badge" cx="50" cy="445" r="13"/><text class="num" x="50" y="449.5" text-anchor="middle">4</text><text class="rname" x="74" y="450"><tspan x="74" dy="0">actual action surface</tspan></text><text class="tiny" x="74" y="472">inside</text><text class="src" x="294" y="449"><tspan x="294" dy="0">What is granted and what people</tspan><tspan x="294" dy="19">believe is granted differ, and each</tspan><tspan x="294" dy="19">side sees only its own. Belief</tspan><tspan x="294" dy="19">follows past consequences more than</tspan><tspan x="294" dy="19">present statements.</tspan></text><text class="full" x="569" y="449"><tspan x="569" dy="0"><tspan class="b">Rules and procedures that climb</tspan></tspan><tspan x="569" dy="19"><tspan class="b">upward; </tspan>unmarked limits.</tspan></text><text class="full" x="849" y="449"><tspan x="849" dy="0"><tspan class="b">State freedoms and constraints. </tspan>Widen</tspan><tspan x="849" dy="19">or narrow with shown trust, and only as</tspan><tspan x="849" dy="19">far as 2 and 3 are known.</tspan></text><text class="full" x="1149" y="449"><tspan x="1149" dy="0"><tspan class="b">Mark no limits; </tspan>promise no</tspan><tspan x="1149" dy="19">backing.</tspan></text><line x1="30" y1="544" x2="1395" y2="544" style="stroke:var(--line);stroke-width:1"/><circle class="badge" cx="50" cy="572" r="13"/><text class="num" x="50" y="576.5" text-anchor="middle">5</text><text class="rname" x="74" y="577"><tspan x="74" dy="0">actual actions taken</tspan></text><text class="tiny" x="74" y="599">at the boundary</text><text class="src" x="294" y="576"><tspan x="294" dy="0">Many people act at once. Telling</tspan><tspan x="294" dy="19">costs the actor attention, and</tspan><tspan x="294" dy="19">candour depends on 6.</tspan></text><text class="full" x="569" y="576"><tspan x="569" dy="0"><tspan class="b">Demand status; </tspan>measure inputs; the</tspan><tspan x="569" dy="19">boss does the monitoring.</tspan></text><text class="full" x="849" y="576"><tspan x="849" dy="0"><tspan class="b">Ask only what the next decision needs.</tspan></tspan><tspan x="849" dy="19">The actor says what they intend before</tspan><tspan x="849" dy="19">acting and reports departures after.</tspan><tspan x="849" dy="19">Invite independent inspection.</tspan></text><text class="full" x="1149" y="576"><tspan x="1149" dy="0"><tspan class="b">Don't ask, don't look.</tspan></tspan></text><line x1="30" y1="652" x2="1395" y2="652" style="stroke:var(--line);stroke-width:1"/><circle class="badge" cx="50" cy="680" r="13"/><text class="num" x="50" y="684.5" text-anchor="middle">6</text><text class="rname" x="74" y="685"><tspan x="74" dy="0">actions’ impact on</tspan><tspan x="74" dy="20">internal state</tspan></text><text class="tiny" x="74" y="727">inside</text><text class="src" x="294" y="684"><tspan x="294" dy="0">It shows late, mostly in what people</tspan><tspan x="294" dy="19">do next, and fear is the part most</tspan><tspan x="294" dy="19">often hidden.</tspan></text><text class="full" x="569" y="684"><tspan x="569" dy="0">Judge by outcome; <tspan class="b">punish deviation;</tspan></tspan><tspan x="569" dy="19">take over.</tspan></text><text class="full" x="849" y="684"><tspan x="849" dy="0"><tspan class="b">Back what was done in good faith;</tspan></tspan><tspan x="849" dy="19">correct so they learn.</tspan></text><text class="full" x="1149" y="684"><tspan x="1149" dy="0">Tolerate anything; <tspan class="b">no consequence</tspan></tspan><tspan x="1149" dy="19"><tspan class="b">and no recognition.</tspan></tspan></text><line x1="30" y1="746" x2="1395" y2="746" style="stroke:var(--line);stroke-width:1"/><circle class="badge" cx="50" cy="774" r="13"/><text class="num" x="50" y="778.5" text-anchor="middle">7</text><text class="rname" x="74" y="779"><tspan x="74" dy="0">actions’ impact on</tspan><tspan x="74" dy="20">external state</tspan></text><text class="tiny" x="74" y="821">outside</text><text class="src" x="294" y="778"><tspan x="294" dy="0">It cannot be cleanly separated from</tspan><tspan x="294" dy="19">8.</tspan></text><text class="full" x="569" y="778"><tspan x="569" dy="0"><tspan class="b">Read the scorecard as the thing;</tspan></tspan><tspan x="569" dy="19">assume a fixed causal chain.</tspan></text><text class="full" x="849" y="778"><tspan x="849" dy="0"><tspan class="b">Look for yourself. </tspan>If targets are hit</tspan><tspan x="849" dy="19">and the purpose isn't, change the</tspan><tspan x="849" dy="19">targets.</tspan></text><text class="full" x="1149" y="778"><tspan x="1149" dy="0"><tspan class="b">Don't check whether it worked.</tspan></tspan></text><line x1="30" y1="840" x2="1395" y2="840" style="stroke:var(--line);stroke-width:1"/><circle class="badge" cx="50" cy="868" r="13"/><text class="num" x="50" y="872.5" text-anchor="middle">8</text><text class="rname" x="74" y="873"><tspan x="74" dy="0">external response &amp;</tspan><tspan x="74" dy="20">world drift</tspan></text><text class="tiny" x="74" y="915">outside</text><text class="src" x="294" y="872"><tspan x="294" dy="0">Other parties' reasons can only be</tspan><tspan x="294" dy="19">inferred. Some of it is never known.</tspan></text><text class="full" x="569" y="872"><tspan x="569" dy="0">Build on a prediction; <tspan class="b">hold the plan;</tspan></tspan><tspan x="569" dy="19">treat deviation as failure.</tspan></text><text class="full" x="849" y="872"><tspan x="849" dy="0"><tspan class="b">Depend on no single response. </tspan>Take the</tspan><tspan x="849" dy="19">openings. Keep the loop short.</tspan></text><text class="full" x="1149" y="872"><tspan x="1149" dy="0"><tspan class="b">Drift; </tspan>let things happen to you.</tspan></text><line x1="30" y1="934" x2="1395" y2="934" style="stroke:var(--line);stroke-width:1"/><path d="M1413 244 h10 V534 h-10" style="fill:none;stroke:var(--ink);stroke-width:1.5"/><text class="small" x="1435" y="359.0"><tspan x="1435" dy="0">Coupled: the action</tspan><tspan x="1435" dy="18">surface can be</tspan><tspan x="1435" dy="18">widened only as far</tspan><tspan x="1435" dy="18">as capability and</tspan><tspan x="1435" dy="18">intent are known</tspan><tspan x="1435" dy="18">(Marquet).</tspan></text></svg>